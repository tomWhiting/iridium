name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace (all features)
        run: cargo check --workspace --all-features --all-targets
      - name: Check editor kernel without default features
        # Precursor to the Phase 2 kernel gate: the editing core must build
        # without the syntax feature (and, post-split, without any GPU crate).
        run: cargo check -p iridium-editor --no-default-features
      - name: Check web bindings on the wasm target
        # The wasm module is target-gated (cfg(target_arch = "wasm32")), so
        # native checks never type-check it. This is the exact feature set
        # wasm-pack builds with; without it a broken WebEditor surface is
        # invisible until someone runs wasm-pack locally.
        run: >
          cargo check -p iridium-bindings --no-default-features --features web
          --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver
        # `cargo test --workspace` sweeps in the offscreen GPU harnesses
        # (`plain_frames`, `retained_shaping`), and a GitHub runner has no
        # graphics adapter, so `request_adapter` failed and those harnesses
        # exited 1 — by design, because a missing GPU must fail loudly
        # rather than pass over work that did not happen. That design is
        # right and stays; what was wrong is asking a runner to satisfy it
        # with nothing installed. Mesa's lavapipe is a real Vulkan ICD that
        # renders on the CPU, so the harnesses run for real instead of
        # being skipped.
        #
        # Deliberately NOT the alternative fix. Excluding these tests from
        # CI, or teaching them to skip when no adapter is found, would turn
        # them into exactly what the comment three steps below warns
        # against: a configuration whose tests never run. Move the runner
        # into the test's reach, never the test out of the runner's.
        #
        # SCOPE, stated here so nobody has to infer it: lavapipe is a
        # DIFFERENT RENDERER. A green run certifies the software path, not
        # the GPU path, so any assertion about rendered output rather than
        # about constants is verified against CPU rasterisation only.
        # Enormously better than harnesses that never execute, and still
        # not a claim about a real adapter.
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -40
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run kernel tests without default features
        # `cargo check` on this configuration is not enough: it once compiled
        # while the test target did not, because a stub type the tests needed
        # was missing. A configuration whose tests never run is a
        # configuration nobody can rely on.
        run: cargo test -p iridium-editor --no-default-features
      - name: Run kernel tests with syntax but no GPU
        # The configuration a terminal face actually ships in.
        run: cargo test -p iridium-editor --no-default-features --features syntax

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # Denying, not reporting. `continue-on-error` used to sit here and
        # made this job incapable of failing whatever it printed; the count
        # its comment tracked ("228 on 2026-07-12") had reached zero without
        # anyone noticing, which is what a report nobody acts on looks like
        # from the inside. Adding a stricter flag to a job that cannot fail
        # buys a stricter report and no enforcement, so the flag and the
        # removal belong in the same change.
        #
        # `-D warnings` goes after `--`, NOT in RUSTFLAGS. The `--` form
        # reaches primary units only; RUSTFLAGS reaches dependency
        # compilation too, and this graph carries `block v0.1.6`, which is
        # flagged for future-incompat and would fail the job for code we do
        # not own. Verified locally: this exact invocation exits 0 while
        # still emitting the `block` future-incompat note.
        #
        # This covers `--all-features` only. The GPU-free and wasm
        # configurations compile DIFFERENT code and have never been run
        # through clippy at all — 17 and 110 warnings respectively as of
        # 2026-08-05. Extending the gate to them is a burn-down, not a flag.
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
