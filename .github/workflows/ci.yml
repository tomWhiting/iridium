# ⛔ THIS WORKFLOW DOES NOT RUN. ACTIONS IS DISABLED FOR THIS REPOSITORY.
#
# `gh api repos/tomWhiting/iridium/actions/permissions` returns
# `{"enabled": false}`, on the owner's instruction. Every job below is inert:
# nothing here has executed, and pushing to `main` or opening a pull request
# will not execute it.
#
# ⚠️ The hazard this comment exists to close: a committed workflow file is
# indistinguishable from a running one to anything that looks at the repository
# rather than at the Actions API. A reader — human or automated — asking "does
# this project have a gate runner?" reads `.github/workflows/ci.yml` and
# concludes yes. It is a false green of exactly the kind this codebase treats
# as a first-order defect, and it is invisible from inside the file.
#
# The file is kept deliberately, not by accident. It is the specification for a
# self-hosted runner that has not been stood up yet, and deleting it would
# throw away the gate definitions below.
#
# ⭐ THE REAL GATE IS LOCAL AND MANUAL. Nine commands, each run unpiped with its
# exit status checked separately, `cargo fmt --all` first:
#
#     cargo test --workspace --all-features --no-fail-fast
#     cargo test -p iridium-editor --no-default-features --no-fail-fast
#     cargo test -p iridium-editor --no-default-features --features syntax --no-fail-fast
#     cargo check -p iridium-bindings --no-default-features --features web --target wasm32-unknown-unknown
#     cargo clippy --workspace --all-features --all-targets -- -D warnings
#     cargo clippy -p iridium-editor --no-default-features --all-targets -- -D warnings
#     cargo clippy -p iridium-editor --no-default-features --features syntax --all-targets -- -D warnings
#     cargo clippy -p iridium-bindings --no-default-features --features web --target wasm32-unknown-unknown -- -D warnings
#     cargo fmt --all --check
#
# If you are relying on this file to catch something, you are relying on
# nothing. Run the nine.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialise the pinned toolchain
        # ⭐ THE WORKFLOW NAMES NO VERSION ANYWHERE. That is deliberate.
        #
        # `rust-toolchain.toml` at the repo root pins the channel (1.97.1) and
        # declares the components and targets every job below needs. rustup
        # reads that file on any invocation inside the checkout and installs
        # what it names, so `rustup show` is what turns the pin into an
        # installed toolchain. Nothing here repeats the version, because a
        # version written in two places is a version that can disagree with
        # itself — and CI disagreeing with the developer's box is the exact
        # failure #74 was opened about.
        #
        # This replaces `dtolnay/rust-toolchain@stable`, which resolved to
        # whatever stable was current that morning. Two of the gates in this
        # workflow — clippy and fmt — are verdicts rendered by the toolchain
        # rather than by the code, so under `@stable` a pull request that was
        # green today could go red tomorrow with no commit in between, and the
        # failure would land on whatever happened to be in flight. With the pin
        # a toolchain move is a reviewable one-line commit instead of weather.
        #
        # The version print stays, and is still not redundant: the pin says
        # what was ASKED for, and this says what was RESOLVED. They come apart
        # if rustup is too old to honour the file, or if a self-hosted runner
        # ships an overriding `RUSTUP_TOOLCHAIN`. A pin is a claim; this is the
        # measurement of it.
        #
        # `--verbose` deliberately: it adds the commit hash, commit date, host
        # triple and LLVM version. The LLVM version is the half that explains
        # codegen and lint changes a release number alone does not.
        #
        # Placed before the cache restore so it is present in the log even when
        # a later step fails, and never `continue-on-error` — a step that
        # cannot fail is a step whose output nobody can trust, and if `rustc`
        # is not on PATH here the job is broken anyway.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace (all features)
        run: cargo check --workspace --all-features --all-targets
      - name: Check editor kernel without default features
        # Precursor to the Phase 2 kernel gate: the editing core must build
        # without the syntax feature (and, post-split, without any GPU crate).
        run: cargo check -p iridium-editor --no-default-features
      - name: Check web bindings on the wasm target
        # The wasm module is target-gated (cfg(target_arch = "wasm32")), so
        # native checks never type-check it. This is the exact feature set
        # wasm-pack builds with; without it a broken WebEditor surface is
        # invisible until someone runs wasm-pack locally.
        run: >
          cargo check -p iridium-bindings --no-default-features --features web
          --target wasm32-unknown-unknown

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialise the pinned toolchain
        # Why, at length, in the Check job. Short form: the version lives in
        # `rust-toolchain.toml` and nowhere else, `rustup show` installs it,
        # and the print records what was actually resolved rather than what
        # was asked for.
        #
        # This job's failures are the code's own far more often than the
        # toolchain's — but "far more often" is not "always", and the reader
        # deciding which one they are looking at is the reader who needs this.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Install a software Vulkan driver
        # `cargo test --workspace` sweeps in the offscreen GPU harnesses
        # (`plain_frames`, `retained_shaping`), and a GitHub runner has no
        # graphics adapter, so `request_adapter` failed and those harnesses
        # exited 1 — by design, because a missing GPU must fail loudly
        # rather than pass over work that did not happen. That design is
        # right and stays; what was wrong is asking a runner to satisfy it
        # with nothing installed. Mesa's lavapipe is a real Vulkan ICD that
        # renders on the CPU, so the harnesses run for real instead of
        # being skipped.
        #
        # Deliberately NOT the alternative fix. Excluding these tests from
        # CI, or teaching them to skip when no adapter is found, would turn
        # them into exactly what the comment three steps below warns
        # against: a configuration whose tests never run. Move the runner
        # into the test's reach, never the test out of the runner's.
        #
        # SCOPE, stated here so nobody has to infer it: lavapipe is a
        # DIFFERENT RENDERER. A green run certifies the software path, not
        # the GPU path, so any assertion about rendered output rather than
        # about constants is verified against CPU rasterisation only.
        # Enormously better than harnesses that never execute, and still
        # not a claim about a real adapter.
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary | head -40
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Run kernel tests without default features
        # `cargo check` on this configuration is not enough: it once compiled
        # while the test target did not, because a stub type the tests needed
        # was missing. A configuration whose tests never run is a
        # configuration nobody can rely on.
        run: cargo test -p iridium-editor --no-default-features
      - name: Run kernel tests with syntax but no GPU
        # The configuration a terminal face actually ships in.
        run: cargo test -p iridium-editor --no-default-features --features syntax

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialise the pinned toolchain
        # ⭐ THE JOB THE PIN MATTERS MOST IN, together with Format.
        #
        # Both steps below deny on warnings, so their verdict is a function of
        # the lint set clippy shipped that day as much as of the code. Under
        # the old `@stable` that meant a new stable landing, a nursery lint
        # gaining a case, and this job going red on a branch nobody touched.
        # `rust-toolchain.toml` is what stops that; the versions printed here
        # are what let two runs be compared when it happens anyway.
        #
        # `components = ["clippy"]` lives in that file, not in this job, so
        # clippy is present by the same mechanism on every runner and on the
        # developer's box.
        #
        # Clippy's version is printed as well as rustc's because they are not
        # the same number and the lint set follows clippy's.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        # Denying, not reporting. `continue-on-error` used to sit here and
        # made this job incapable of failing whatever it printed; the count
        # its comment tracked ("228 on 2026-07-12") had reached zero without
        # anyone noticing, which is what a report nobody acts on looks like
        # from the inside. Adding a stricter flag to a job that cannot fail
        # buys a stricter report and no enforcement, so the flag and the
        # removal belong in the same change.
        #
        # `-D warnings` goes after `--`, NOT in RUSTFLAGS. The `--` form
        # reaches primary units only; RUSTFLAGS reaches dependency
        # compilation too, and this graph carries `block v0.1.6`, which is
        # flagged for future-incompat and would fail the job for code we do
        # not own. Verified locally: this exact invocation exits 0 while
        # still emitting the `block` future-incompat note.
        #
        # This covers `--all-features` only. The GPU-free and wasm
        # configurations compile DIFFERENT code.
        #
        # UPDATE 2026-08-08: the wasm half IS now gated, by the step below —
        # and the prediction in the line that used to sit here held exactly.
        # "Extending the gate to them is a burn-down, not a flag" was right:
        # it took 68 diagnostics across four commits, and the flag was the last
        # thing added, not the first. The GPU-free kernel is still ungated and
        # is still a burn-down.
        #
        # Counts, each with the invocation that produced it, because an
        # earlier revision of this comment said "17 and 110" with no
        # command attached and the 110 was unreproducible within hours —
        # it matches no metric on this tree. A bare number in a durable
        # artifact outlives the command that made it by definition, which
        # is the one place "state the figure with its command" matters
        # most and the one place it had not been applied.
        #
        #    17  cargo clippy -p iridium-editor --no-default-features
        #          --all-targets
        #   102  cargo clippy -p iridium-bindings --no-default-features
        #          --features web --target wasm32-unknown-unknown
        #          (adding --all-targets changes nothing: no extra target
        #           in that crate compiles for wasm32)
        #
        # Metric: unique (lint, file, line) over --message-format=json,
        # measured 2026-08-05. NOT cargo's own summary line, which says
        # "78 warnings" for the same wasm run because it counts only the
        # iridium-bindings unit; the other 25 belong to iridium-editor
        # compiled under the web feature set. Two honest numbers for one
        # invocation, so the metric has to be stated or the count means
        # nothing.
        #
        # ⚠️ THIS GATE'S VERDICT DEPENDS ON WORKSPACE ARTIFACTS NOT BEING
        # CACHED. `rust-cache` runs with `cache-all-crates: false`, so it
        # restores dependencies but cleans our crates before saving — every
        # run re-analyses all seven from source, which is the only reason a
        # denial here means anything. `--` args reach primary units only, so
        # the cache's scope and this flag's scope are disjoint by
        # construction. Flip `cache-all-crates` to `true` and the gate
        # silently degrades to replaying cached diagnostics: still green,
        # still fast, no longer checking anything. Verified 2026-08-05 —
        # a cache-hit run still printed `Checking` for six workspace crates
        # and `Compiling` for the seventh.
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Clippy on the wasm target
        # The gate the comment above says does not exist. It does now.
        #
        # `wasm.rs` is 3,160 lines behind
        # `all(feature = "web", target_arch = "wasm32")`, and until this step
        # the ONLY thing that compiled it was the `check` in the Check job —
        # a check, not a lint. Everything clippy had to say about the browser
        # face went unsaid.
        #
        # ⚠️ The count this closed was 68, not the 8 the backlog item claimed.
        # `-D warnings` reports the FIRST unit that fails, and `iridium-editor`
        # is a dependency here, so it aborted there with 8 and the 60 in
        # `wasm.rs` were never reached. An error count from a denying run is an
        # ordering artefact; measure with warnings left as warnings.
        #
        # `--all-targets` is deliberately absent: no extra target in this crate
        # compiles for wasm32, so it changes nothing but the command's length.
        # Verified 2026-08-08.
        #
        # `-D warnings` after `--`, never in RUSTFLAGS, for the same reason the
        # step above says: RUSTFLAGS reaches dependency compilation and this
        # graph carries `block v0.1.6`, flagged future-incompat, which would
        # fail the job for code we do not own.
        run: |
          cargo clippy -p iridium-bindings --no-default-features --features web \
            --target wasm32-unknown-unknown -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialise the pinned toolchain
        # ⭐ The other gate whose verdict is the toolchain's rather than the
        # code's — and the sharper of the two, because rustfmt's output changes
        # with no diagnostic at all: a new stable reflows something, this job
        # goes red, and the diff it objects to was written months ago.
        #
        # `rustfmt.toml` carries a finding with a toolchain attached: 19 of the
        # options it used to declare were measured to change nothing, and its
        # own comment says that holds "against THIS toolchain and style
        # edition" — an option that restates a default stops being a no-op the
        # moment the default moves. Before the pin, that measurement had no
        # toolchain it could be re-checked against and quietly decayed into a
        # claim about no particular compiler. `rust-toolchain.toml` gives it
        # one, and this step records the version that was actually resolved.
        #
        # `components = ["rustfmt"]` lives in that file, not in this job.
        run: |
          rustup show
          rustc --version --verbose
          cargo --version
          cargo fmt --version
      - name: Check formatting
        run: cargo fmt --all --check
