<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridium Editor - WebGPU Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3c3c3c;
        }
        h1 {
            font-size: 18px;
            font-weight: 500;
        }
        .status {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            font-size: 13px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3c3c3c;
        }
        .status-dot.success { background: #4ec9b0; }
        .status-dot.error { background: #f14c4c; }
        .status-dot.pending { background: #cca700; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .editor-container {
            flex: 1;
            position: relative;
            min-height: 400px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            overflow: hidden;
        }
        #editor-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: text;
        }
        #editor-canvas:focus {
            box-shadow: inset 0 0 0 2px #0e639c;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button, select {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover, select:hover {
            background: #1177bb;
        }
        button:disabled, select:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        .info-panel {
            margin-top: 12px;
            padding: 12px;
            background: #252526;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .error-message {
            color: #f14c4c;
            padding: 20px;
            text-align: center;
        }
        #log {
            margin-top: 12px;
            padding: 12px;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-entry.error { color: #f14c4c; }
        .log-entry.success { color: #4ec9b0; }
        .log-entry.info { color: #569cd6; }
    </style>
</head>
<body>
    <header>
        <h1>Iridium Editor - WebGPU Test</h1>
        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="webgpu-status"></div>
                <span>WebGPU</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="wasm-status"></div>
                <span>WASM Module</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="editor-status"></div>
                <span>Editor</span>
            </div>
        </div>
    </header>
    <main>
        <div class="toolbar">
            <button id="btn-insert" disabled>Insert Text</button>
            <button id="btn-clear" disabled>Clear</button>
            <button id="btn-undo" disabled>Undo</button>
            <button id="btn-redo" disabled>Redo</button>
            <button id="btn-theme" disabled>Toggle Theme</button>
            <button id="btn-syntax" disabled>Toggle Syntax</button>
            <button id="btn-gutter" disabled>Toggle Gutter</button>
            <button id="btn-fold-all" disabled>Fold All</button>
            <button id="btn-unfold-all" disabled>Unfold All</button>
            <button id="btn-toggle-fold" disabled>Toggle Fold</button>
            <select id="lang-select" disabled>
                <option value="rust">Rust</option>
                <option value="typescript">TypeScript</option>
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="go">Go</option>
                <option value="json">JSON</option>
                <option value="yaml">YAML</option>
                <option value="toml">TOML</option>
                <option value="bash">Bash</option>
                <option value="css">CSS</option>
            </select>
        </div>
        <div class="editor-container">
            <canvas id="editor-canvas" tabindex="0"></canvas>
        </div>
        <div class="info-panel" id="info">
            Cursor: Line 0, Column 0 | Lines: 0 | Undo: false | Redo: false
        </div>
        <div id="log"></div>
    </main>

    <!-- Load web-tree-sitter before module scripts -->
    <script src="https://cdn.jsdelivr.net/npm/web-tree-sitter@0.22.6/tree-sitter.js"></script>

    <script type="module">
        // Logging utility
        const logEl = document.getElementById('log');
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // ============================================================
        // Tree-sitter Syntax Highlighter
        // ============================================================

        // Highlight queries for each language (simplified for compatibility with older grammars)
        const HIGHLIGHT_QUERIES = {
            rust: `
(identifier) @variable
(metavariable) @variable
(type_identifier) @type
(fragment_specifier) @type
(primitive_type) @type.builtin
(self) @variable.special
(field_identifier) @property
(shorthand_field_identifier) @property

(trait_item name: (type_identifier) @type.interface)
(impl_item trait: (type_identifier) @type.interface)
(abstract_type trait: (type_identifier) @type.interface)
(dynamic_type trait: (type_identifier) @type.interface)
(trait_bounds (type_identifier) @type.interface)

(call_expression
  function: [
    (identifier) @function
    (scoped_identifier
      name: (identifier) @function)
    (field_expression
      field: (field_identifier) @function.method)
  ])

(generic_function
  function: [
    (identifier) @function
    (scoped_identifier
      name: (identifier) @function)
    (field_expression
      field: (field_identifier) @function.method)
  ])

(function_item name: (identifier) @function.definition)
(function_signature_item name: (identifier) @function.definition)

(macro_invocation
  macro: [
    (identifier) @function.special
    (scoped_identifier
      name: (identifier) @function.special)
  ])

(macro_invocation
  "!" @function.special)

(macro_definition
  name: (identifier) @function.special.definition)

; Identifier conventions

; Assume uppercase names are types/enum-constructors
((identifier) @type
 (#match? @type "^[A-Z]"))

; Assume all-caps names are constants
((identifier) @constant
 (#match? @constant "^_*[A-Z][A-Z\\\\d_]*$"))

[
  "("
  ")"
  "{"
  "}"
  "["
  "]"
] @punctuation.bracket

[
  "."
  ";"
  ","
  "::"
] @punctuation.delimiter

[
  "#"
] @punctuation.special

[
  "as"
  "async"
  "const"
  "default"
  "dyn"
  "enum"
  "extern"
  "fn"
  "impl"
  "let"
  "macro_rules!"
  "mod"
  "move"
  "pub"
  "ref"
  "static"
  "struct"
  "for"
  "trait"
  "type"
  "union"
  "unsafe"
  "use"
  "where"
  (crate)
  (mutable_specifier)
  (super)
] @keyword

[
  "await"
  "break"
  "continue"
  "else"
  "if"
  "in"
  "loop"
  "match"
  "return"
  "while"
  "yield"
] @keyword.control

[
  (string_literal)
  (raw_string_literal)
  (char_literal)
] @string

(escape_sequence) @string.escape

[
  (integer_literal)
  (float_literal)
] @number

(boolean_literal) @boolean

[
  (line_comment)
  (block_comment)
] @comment

[
  "!="
  "%"
  "%="
  "&"
  "&="
  "&&"
  "*"
  "*="
  "+"
  "+="
  "-"
  "-="
  "->"
  ".."
  "..="
  "..."
  "/="
  ":"
  "<<"
  "<<="
  "<"
  "<="
  "="
  "=="
  "=>"
  ">"
  ">="
  ">>"
  ">>="
  "@"
  "^"
  "^="
  "|"
  "|="
  "||"
  "?"
] @operator

(unary_expression "!" @operator)

(lifetime
  "'" @lifetime
  (identifier) @lifetime)

(parameter (identifier) @variable.parameter)

(attribute_item (attribute [
  (identifier) @attribute
  (scoped_identifier name: (identifier) @attribute)
]))

(inner_attribute_item (attribute [
  (identifier) @attribute
  (scoped_identifier name: (identifier) @attribute)
]))
`,

            typescript: `
; Variables and identifiers
(identifier) @variable
(type_identifier) @type
(predefined_type) @type.builtin
(property_identifier) @property

; Function calls
(call_expression function: (identifier) @function)
(call_expression function: (member_expression property: (property_identifier) @function.method))

; Function definitions
(function_declaration name: (identifier) @function.definition)
(method_definition name: (property_identifier) @function.method)
(arrow_function) @function

; Parameters
(required_parameter (identifier) @variable.parameter)
(optional_parameter (identifier) @variable.parameter)

; Literals
(this) @variable.special
(super) @variable.special
(null) @constant.builtin
(undefined) @constant.builtin
(true) @boolean
(false) @boolean
(comment) @comment
(string) @string
(template_string) @string
(escape_sequence) @string.escape
(number) @number

; Punctuation
[";" "." "," ":" "?"] @punctuation.delimiter
["(" ")" "[" "]" "{" "}"] @punctuation.bracket

; Operators
["+" "-" "*" "/" "%" "=" "==" "===" "!=" "!==" "<" ">" "<=" ">=" "&&" "||" "!" "=>" "??" "..." "++" "--"] @operator

; Keywords
["abstract" "as" "async" "await" "class" "const" "debugger" "declare" "default" "delete" "enum" "export" "extends" "from" "function" "get" "implements" "import" "in" "instanceof" "interface" "is" "keyof" "let" "module" "namespace" "new" "of" "override" "private" "protected" "public" "readonly" "set" "static" "type" "typeof" "var" "void" "with"] @keyword

["break" "case" "catch" "continue" "do" "else" "finally" "for" "if" "return" "switch" "throw" "try" "while" "yield"] @keyword.control
`,

            python: `
; Identifier naming
(identifier) @variable
(type (identifier) @type)
(comment) @comment
(string) @string
(escape_sequence) @string.escape

; Function calls
(call function: (identifier) @function)
(call function: (attribute attribute: (identifier) @function.method))

; Function definitions
(function_definition name: (identifier) @function.definition)

; Parameters
(parameters (identifier) @variable.parameter)
(typed_parameter (identifier) @variable.parameter)
(default_parameter name: (identifier) @variable.parameter)

; Class definitions
(class_definition name: (identifier) @type)

; Literals
(true) @boolean
(false) @boolean
(none) @constant.builtin
(integer) @number
(float) @number

; Punctuation
["." "," ":"] @punctuation.delimiter
["(" ")" "[" "]" "{" "}"] @punctuation.bracket

; Operators
["-" "*" "**" "/" "//" "%" "+" "<" ">" "<=" ">=" "==" "!=" "=" ":=" "&" "|" "^" "~" "<<" ">>"] @operator
["and" "in" "is" "not" "or"] @keyword.operator

; Keywords
["as" "assert" "async" "await" "break" "class" "continue" "def" "del" "elif" "else" "except" "finally" "for" "from" "global" "if" "import" "lambda" "nonlocal" "pass" "raise" "return" "try" "while" "with" "yield" "match" "case"] @keyword
`,

            javascript: `
(identifier) @variable
(property_identifier) @property
(call_expression function: (identifier) @function)
(call_expression function: (member_expression property: (property_identifier) @function.method))
(function_declaration name: (identifier) @function.definition)
(method_definition name: (property_identifier) @function.method)
(arrow_function) @function
(formal_parameters (identifier) @variable.parameter)
(this) @variable.special
(super) @variable.special
(null) @constant.builtin
(undefined) @constant.builtin
(true) @boolean
(false) @boolean
(comment) @comment
(string) @string
(template_string) @string
(escape_sequence) @string.escape
(number) @number
(regex) @string.regex
[";" "." "," ":" "?"] @punctuation.delimiter
["(" ")" "[" "]" "{" "}"] @punctuation.bracket
["+" "-" "*" "/" "%" "=" "==" "===" "!=" "!==" "<" ">" "<=" ">=" "&&" "||" "!" "=>" "??" "..." "++" "--"] @operator
["as" "async" "await" "class" "const" "debugger" "default" "delete" "export" "extends" "from" "function" "get" "import" "in" "instanceof" "let" "new" "of" "set" "static" "typeof" "var" "void" "with"] @keyword
["break" "case" "catch" "continue" "do" "else" "finally" "for" "if" "return" "switch" "throw" "try" "while" "yield"] @keyword.control
`,

            json: `
(string) @string
(number) @number
(null) @constant.builtin
(true) @boolean
(false) @boolean
(pair key: (string) @property)
["," ":"] @punctuation.delimiter
["[" "]" "{" "}"] @punctuation.bracket
`,

            yaml: `
(comment) @comment
(double_quote_scalar) @string
(single_quote_scalar) @string
(integer_scalar) @number
(float_scalar) @number
(boolean_scalar) @boolean
(null_scalar) @constant.builtin
`,

            bash: `
(variable_name) @variable
(command_name) @function
(comment) @comment
(string) @string
(number) @number
["(" ")" "[" "]" "{" "}"] @punctuation.bracket
[";" "&"] @punctuation.delimiter
`,

            css: `
(comment) @comment
(tag_name) @tag
(class_name) @type
(id_name) @constant
(property_name) @property
(plain_value) @string
(string_value) @string
(color_value) @number
(integer_value) @number
(float_value) @number
["," ":" ";"] @punctuation.delimiter
["(" ")" "[" "]" "{" "}"] @punctuation.bracket
`,

            go: `
(identifier) @variable
(type_identifier) @type
(field_identifier) @property
(package_identifier) @variable
(call_expression function: (identifier) @function)
(call_expression function: (selector_expression field: (field_identifier) @function.method))
(function_declaration name: (identifier) @function.definition)
(method_declaration name: (field_identifier) @function.method)
(parameter_declaration (identifier) @variable.parameter)
(comment) @comment
(interpreted_string_literal) @string
(raw_string_literal) @string
(rune_literal) @string
(escape_sequence) @string.escape
(int_literal) @number
(float_literal) @number
(imaginary_literal) @number
(true) @boolean
(false) @boolean
(nil) @constant.builtin
["." "," ":" ";"] @punctuation.delimiter
["(" ")" "[" "]" "{" "}"] @punctuation.bracket
["+" "-" "*" "/" "%" "&" "|" "^" "<" ">" "=" "!" ":=" "+=" "-=" "*=" "/=" "==" "!=" "<=" ">=" "&&" "||" "<<" ">>" "&^" "<-"] @operator
["break" "case" "chan" "const" "continue" "default" "defer" "else" "fallthrough" "for" "func" "go" "goto" "if" "import" "interface" "map" "package" "range" "return" "select" "struct" "switch" "type" "var"] @keyword
`,

            toml: `
(comment) @comment
(string) @string
(integer) @number
(float) @number
(boolean) @boolean
(bare_key) @property
(quoted_key) @property
["=" "." ","] @punctuation.delimiter
["[" "]" "{" "}"] @punctuation.bracket
`
        };

        // Grammar WASM URLs from Sourcegraph's pre-built package
        const GRAMMAR_URLS = {
            rust: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-rust.wasm',
            typescript: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-typescript.wasm',
            python: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-python.wasm',
            javascript: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-javascript.wasm',
            json: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-json.wasm',
            yaml: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-yaml.wasm',
            bash: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-bash.wasm',
            css: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-css.wasm',
            go: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-go.wasm',
            toml: 'https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.13/out/tree-sitter-toml.wasm'
        };

        /**
         * SyntaxManager handles tree-sitter parsing and highlighting.
         * It loads the tree-sitter library and grammar WASM files,
         * then provides highlight spans for the Rust renderer.
         */
        class SyntaxManager {
            constructor() {
                this.Parser = null;
                this.parser = null;
                this.languages = {}; // { langName: { grammar, query } }
                this.currentLang = 'rust';
                this.tree = null;
                this.ready = false;
                this.parseErrors = {}; // Track grammars that have parse errors
            }

            async initialize(defaultLang = 'rust') {
                try {
                    log('Initializing tree-sitter...');

                    // Initialize tree-sitter WASM
                    await TreeSitter.init();
                    this.Parser = TreeSitter;
                    this.parser = new this.Parser();

                    // Load the default language
                    await this.loadLanguage(defaultLang);
                    this.currentLang = defaultLang;

                    this.ready = true;
                    log(`Tree-sitter initialized with ${defaultLang} grammar`, 'success');
                    return true;
                } catch (e) {
                    log(`Tree-sitter initialization failed: ${e.message}`, 'error');
                    console.error('Tree-sitter init error:', e);
                    this.ready = false;
                    return false;
                }
            }

            async loadLanguage(langName) {
                if (this.languages[langName]) {
                    return; // Already loaded
                }

                const url = GRAMMAR_URLS[langName];
                const query = HIGHLIGHT_QUERIES[langName];

                if (!url || !query) {
                    throw new Error(`Unsupported language: ${langName}`);
                }

                log(`Loading ${langName} grammar...`);
                const grammar = await this.Parser.Language.load(url);

                log(`Compiling ${langName} highlight query...`);
                const compiledQuery = grammar.query(query);

                this.languages[langName] = { grammar, query: compiledQuery };
            }

            async setLanguage(langName) {
                if (!this.ready) return;

                try {
                    await this.loadLanguage(langName);
                    this.currentLang = langName;
                    this.parser.setLanguage(this.languages[langName].grammar);
                    this.tree = null; // Clear cached tree
                    // Clear parse error flag - give it a fresh chance with new content
                    delete this.parseErrors[langName];
                    log(`Switched to ${langName}`, 'success');
                } catch (e) {
                    log(`Failed to switch language: ${e.message}`, 'error');
                }
            }

            getCurrentLanguage() {
                return this.currentLang;
            }

            getAvailableLanguages() {
                return Object.keys(GRAMMAR_URLS);
            }

            /**
             * Parse content and return highlight spans.
             * Each span has: { start: number, end: number, type: string }
             */
            highlight(content) {
                if (!this.ready || !this.languages[this.currentLang]) {
                    return [];
                }

                // Skip if this grammar has known parse errors
                if (this.parseErrors[this.currentLang]) {
                    return [];
                }

                try {
                    const langData = this.languages[this.currentLang];

                    // Ensure parser has correct language set
                    this.parser.setLanguage(langData.grammar);

                    // Parse the content
                    this.tree = this.parser.parse(content);

                    // Run the highlight query
                    const captures = langData.query.captures(this.tree.rootNode);

                    // Convert captures to spans
                    const spans = captures.map(capture => ({
                        start: capture.node.startIndex,
                        end: capture.node.endIndex,
                        type: capture.name
                    }));

                    // Sort by start position and remove duplicates
                    spans.sort((a, b) => a.start - b.start || a.end - b.end);

                    return spans;
                } catch (e) {
                    // Only log once per grammar to avoid console spam
                    if (!this.parseErrors[this.currentLang]) {
                        console.warn(`[${this.currentLang}] Parser error (grammar may be incompatible):`, e.message);
                        this.parseErrors[this.currentLang] = true;
                    }
                    return [];
                }
            }

            /**
             * Incremental update after an edit.
             */
            update(content, startByte, oldEndByte, newEndByte, startPoint, oldEndPoint, newEndPoint) {
                if (!this.ready || !this.tree || !this.languages[this.currentLang]) {
                    return this.highlight(content);
                }

                try {
                    const langData = this.languages[this.currentLang];

                    // Apply the edit to the existing tree
                    this.tree.edit({
                        startIndex: startByte,
                        oldEndIndex: oldEndByte,
                        newEndIndex: newEndByte,
                        startPosition: startPoint,
                        oldEndPosition: oldEndPoint,
                        newEndPosition: newEndPoint
                    });

                    // Reparse with the edited tree
                    this.tree = this.parser.parse(content, this.tree);

                    // Run the highlight query
                    const captures = langData.query.captures(this.tree.rootNode);

                    return captures.map(capture => ({
                        start: capture.node.startIndex,
                        end: capture.node.endIndex,
                        type: capture.name
                    }));
                } catch (e) {
                    console.error('Incremental update error:', e);
                    return this.highlight(content);
                }
            }
        }

        // Global syntax manager instance
        const syntaxManager = new SyntaxManager();

        // Status indicators
        const webgpuStatus = document.getElementById('webgpu-status');
        const wasmStatus = document.getElementById('wasm-status');
        const editorStatus = document.getElementById('editor-status');

        // Buttons
        const btnInsert = document.getElementById('btn-insert');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const btnTheme = document.getElementById('btn-theme');
        const btnSyntax = document.getElementById('btn-syntax');
        const btnGutter = document.getElementById('btn-gutter');
        const btnFoldAll = document.getElementById('btn-fold-all');
        const btnUnfoldAll = document.getElementById('btn-unfold-all');
        const btnToggleFold = document.getElementById('btn-toggle-fold');
        const langSelect = document.getElementById('lang-select');

        // Info panel
        const infoPanel = document.getElementById('info');

        // Editor state
        let editor = null;
        let isDarkTheme = true;

        function updateInfo() {
            if (!editor) return;
            const line = editor.getCursorLine();
            const col = editor.getCursorColumn();
            const lines = editor.getLineCount();
            const canUndo = editor.canUndo();
            const canRedo = editor.canRedo();
            const foldableLines = editor.getFoldableLines();
            const foldedLines = editor.getFoldedLines();
            const hiddenCount = editor.getHiddenLineCount();
            const isFoldable = editor.isFoldable(line);
            const tsActive = editor.isTreeSitterActive ? editor.isTreeSitterActive() : false;
            const lang = syntaxManager.getCurrentLanguage();
            infoPanel.textContent = `Cursor: Line ${line}, Col ${col} | Lines: ${lines} (${hiddenCount} hidden) | Lang: ${lang} | TS: ${tsActive ? 'on' : 'off'}`;
        }

        /**
         * Updates syntax highlighting using tree-sitter.
         * Called after content changes.
         */
        function updateHighlights() {
            if (!editor || !syntaxManager.ready) return;

            try {
                const content = editor.getContent();
                const spans = syntaxManager.highlight(content);
                editor.setTreeSitterHighlights(spans);
            } catch (e) {
                console.error('Failed to update highlights:', e);
            }
        }

        async function init() {
            log('Starting Iridium WebGPU test...');

            // Check WebGPU support
            log('Checking WebGPU support...');
            if (!navigator.gpu) {
                webgpuStatus.classList.add('error');
                log('WebGPU is not supported in this browser', 'error');
                return;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    webgpuStatus.classList.add('error');
                    log('No WebGPU adapter found', 'error');
                    return;
                }
                webgpuStatus.classList.add('success');
                log(`WebGPU adapter: ${adapter.name || 'unnamed'}`, 'success');
            } catch (e) {
                webgpuStatus.classList.add('error');
                log(`WebGPU error: ${e.message}`, 'error');
                return;
            }

            // Load WASM module
            log('Loading WASM module...');
            wasmStatus.classList.add('pending');

            try {
                // Import the WASM module (built by wasm-pack)
                const wasm = await import('./pkg/iridium_bindings.js');
                await wasm.default();

                wasmStatus.classList.remove('pending');
                wasmStatus.classList.add('success');
                log('WASM module loaded', 'success');

                // Check if WebGPU is supported via WASM
                const supported = await wasm.isWebGPUSupported();
                log(`WASM WebGPU check: ${supported}`, supported ? 'success' : 'error');

                // Create editor
                log('Creating WebEditor...');
                editorStatus.classList.add('pending');

                const canvas = document.getElementById('editor-canvas');
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;

                const pixelRatio = window.devicePixelRatio || 1;
                editor = await wasm.createWebEditor(canvas, pixelRatio);

                editorStatus.classList.remove('pending');
                editorStatus.classList.add('success');
                log('WebEditor created', 'success');

                // Load a font - REQUIRED for WASM since no system fonts are available
                log('Fetching font...');
                const fontUrl = 'https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/ttf/FiraCode-Regular.ttf';
                const fontResponse = await fetch(fontUrl);
                if (!fontResponse.ok) {
                    throw new Error(`Failed to fetch font: ${fontResponse.status}`);
                }
                const fontData = new Uint8Array(await fontResponse.arrayBuffer());
                editor.loadFont(fontData);
                log('Font loaded', 'success');

                // Initialize tree-sitter for proper syntax highlighting
                await syntaxManager.initialize();

                // Set initial content - has multiple foldable regions
                editor.setContent(`// Welcome to Iridium Editor!
// This is a GPU-accelerated text editor built with Rust and WebGPU.

fn main() {
    println!("Hello, Iridium!");

    if true {
        println!("Nested block!");
    }
}

fn another_function() {
    // This is another function
    let x = 42;
    let result = {
        // Inner block
        x * 2
    };
    println!("Result: {}", result);
}

struct Example {
    field1: i32,
    field2: String,
}
`);
                log('Initial content set');

                // Apply tree-sitter highlighting
                updateHighlights();

                // Initial render
                editor.forceRender();
                log('Initial render complete', 'success');

                // Enable buttons
                btnInsert.disabled = false;
                btnClear.disabled = false;
                btnUndo.disabled = false;
                btnRedo.disabled = false;
                btnTheme.disabled = false;
                btnSyntax.disabled = false;
                btnGutter.disabled = false;
                btnFoldAll.disabled = false;
                btnUnfoldAll.disabled = false;
                btnToggleFold.disabled = false;
                langSelect.disabled = false;

                // Set up language selector handler
                langSelect.addEventListener('change', async (e) => {
                    await syntaxManager.setLanguage(e.target.value);
                    updateHighlights();
                    editor.forceRender();
                    updateInfo();
                });

                // Set up button handlers
                btnInsert.addEventListener('click', () => {
                    editor.insert('\n// Inserted line');
                    updateHighlights();
                    editor.forceRender();
                    updateInfo();
                });

                btnClear.addEventListener('click', () => {
                    editor.setContent('');
                    updateHighlights();
                    editor.forceRender();
                    updateInfo();
                });

                btnUndo.addEventListener('click', () => {
                    editor.undo();
                    updateHighlights();
                    editor.forceRender();
                    updateInfo();
                });

                btnRedo.addEventListener('click', () => {
                    editor.redo();
                    updateHighlights();
                    editor.forceRender();
                    updateInfo();
                });

                btnTheme.addEventListener('click', () => {
                    isDarkTheme = !isDarkTheme;
                    editor.setDarkTheme(isDarkTheme);
                    editor.forceRender();
                });

                btnSyntax.addEventListener('click', () => {
                    const enabled = editor.isSyntaxEnabled();
                    editor.setSyntaxEnabled(!enabled);
                    editor.forceRender();
                    log(`Syntax highlighting ${!enabled ? 'enabled' : 'disabled'}`);
                });

                btnGutter.addEventListener('click', () => {
                    const enabled = editor.isGutterEnabled();
                    editor.setGutterEnabled(!enabled);
                    editor.forceRender();
                    log(`Gutter ${!enabled ? 'enabled' : 'disabled'}`);
                });

                btnFoldAll.addEventListener('click', () => {
                    editor.foldAll();
                    editor.forceRender();
                    updateInfo();
                    log('Folded all regions');
                });

                btnUnfoldAll.addEventListener('click', () => {
                    editor.unfoldAll();
                    editor.forceRender();
                    updateInfo();
                    log('Unfolded all regions');
                });

                btnToggleFold.addEventListener('click', () => {
                    const line = editor.getCursorLine();
                    const toggled = editor.toggleFold(line);
                    editor.forceRender();
                    updateInfo();
                    if (toggled) {
                        const isFolded = editor.isFolded(line);
                        log(`Line ${line} ${isFolded ? 'folded' : 'unfolded'}`);
                    } else {
                        log(`Line ${line} is not foldable`);
                    }
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    editor.resize(canvas.width, canvas.height);
                    editor.forceRender();
                });

                // Mouse selection handling
                let isDragging = false;

                function getMousePosition(e) {
                    const rect = canvas.getBoundingClientRect();
                    // Account for pixel ratio - mouse events are in CSS pixels, canvas is scaled
                    const x = (e.clientX - rect.left) * window.devicePixelRatio;
                    const y = (e.clientY - rect.top) * window.devicePixelRatio;
                    return editor.pixelToPosition(x, y);
                }

                canvas.addEventListener('mousedown', (e) => {
                    canvas.focus();
                    const [line, column] = getMousePosition(e);

                    if (e.shiftKey) {
                        // Shift+click: extend selection
                        editor.extendSelectionToPosition(line, column);
                    } else {
                        // Normal click: set cursor, start potential drag
                        editor.setCursorFromClick(line, column);
                        isDragging = true;
                    }
                    editor.forceRender();
                    updateInfo();
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const [line, column] = getMousePosition(e);
                        editor.extendSelectionToPosition(line, column);
                        editor.forceRender();
                        updateInfo();
                    }
                });

                canvas.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                canvas.addEventListener('mouseleave', () => {
                    // Continue drag if mouse leaves canvas
                    // (don't stop dragging, let mouseup on document handle it)
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                // Handle keyboard input with Mac modifier support
                canvas.addEventListener('keydown', (e) => {
                    let handled = true;
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const selecting = e.shiftKey;

                    // Handle arrow keys with modifiers
                    if (e.key === 'ArrowLeft') {
                        if (e.metaKey && isMac) {
                            // Cmd+Left: go to line start
                            selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                        } else if (e.altKey) {
                            // Option+Left: word left
                            selecting ? editor.extendSelectionWordLeft() : editor.moveCursorWordLeft();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Left on non-Mac: word left
                            selecting ? editor.extendSelectionWordLeft() : editor.moveCursorWordLeft();
                        } else {
                            selecting ? editor.extendSelectionLeft() : editor.moveCursorLeft();
                        }
                    } else if (e.key === 'ArrowRight') {
                        if (e.metaKey && isMac) {
                            // Cmd+Right: go to line end
                            selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                        } else if (e.altKey) {
                            // Option+Right: word right
                            selecting ? editor.extendSelectionWordRight() : editor.moveCursorWordRight();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Right on non-Mac: word right
                            selecting ? editor.extendSelectionWordRight() : editor.moveCursorWordRight();
                        } else {
                            selecting ? editor.extendSelectionRight() : editor.moveCursorRight();
                        }
                    } else if (e.key === 'ArrowUp') {
                        if (e.metaKey && isMac) {
                            // Cmd+Up: go to document start
                            selecting ? editor.extendSelectionDocStart() : editor.moveCursorDocStart();
                        } else {
                            selecting ? editor.extendSelectionUp() : editor.moveCursorUp();
                        }
                    } else if (e.key === 'ArrowDown') {
                        if (e.metaKey && isMac) {
                            // Cmd+Down: go to document end
                            selecting ? editor.extendSelectionDocEnd() : editor.moveCursorDocEnd();
                        } else {
                            selecting ? editor.extendSelectionDown() : editor.moveCursorDown();
                        }
                    } else if (e.key === 'Home') {
                        // Home key: line start (or doc start with Cmd)
                        if (e.metaKey || e.ctrlKey) {
                            selecting ? editor.extendSelectionDocStart() : editor.moveCursorDocStart();
                        } else {
                            selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                        }
                    } else if (e.key === 'End') {
                        // End key: line end (or doc end with Cmd)
                        if (e.metaKey || e.ctrlKey) {
                            selecting ? editor.extendSelectionDocEnd() : editor.moveCursorDocEnd();
                        } else {
                            selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                        }
                    } else if (e.key === 'a' && (e.metaKey || e.ctrlKey)) {
                        // Cmd+A / Ctrl+A: select all
                        editor.selectAll();
                    } else if (e.key === 'Backspace') {
                        if (e.metaKey && isMac) {
                            // Cmd+Backspace: delete to line start
                            editor.deleteToLineStart();
                        } else if (e.altKey) {
                            // Option+Backspace: delete word backward
                            editor.deleteWordBackward();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Backspace on non-Mac: delete word backward
                            editor.deleteWordBackward();
                        } else {
                            // Check if we're deleting an opening bracket with matching closer
                            const pairMap = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
                            const content = editor.getContent();
                            const lines = content.split('\n');
                            const line = editor.getCursorLine();
                            const col = editor.getCursorColumn();
                            const currentLine = lines[line] || '';
                            const charBefore = col > 0 ? currentLine[col - 1] : '';
                            const charAfter = currentLine[col] || '';

                            if (pairMap[charBefore] && charAfter === pairMap[charBefore]) {
                                // Delete both the opener and closer
                                editor.backspace();
                                editor.delete_forward();
                            } else {
                                editor.backspace();
                            }
                        }
                    } else if (e.key === 'Delete') {
                        if (e.altKey) {
                            // Option+Delete (Fn+Option+Backspace): delete word forward
                            editor.deleteWordForward();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Delete on non-Mac: delete word forward
                            editor.deleteWordForward();
                        } else {
                            editor.delete_forward();
                        }
                    } else if (e.key === 'k' && e.ctrlKey) {
                        // Ctrl+K: delete to end of line (Emacs-style)
                        editor.deleteToLineEnd();
                    } else if (e.key === 'a' && e.ctrlKey && isMac && !e.metaKey) {
                        // Ctrl+A on Mac: go to line start (Emacs-style)
                        selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                    } else if (e.key === 'e' && e.ctrlKey && isMac) {
                        // Ctrl+E on Mac: go to line end (Emacs-style)
                        selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                    } else if (e.key === 'Enter') {
                        const content = editor.getContent();
                        const lines = content.split('\n');
                        const line = editor.getCursorLine();
                        const col = editor.getCursorColumn();
                        const currentLine = lines[line] || '';
                        const charBefore = col > 0 ? currentLine[col - 1] : '';
                        const charAfter = currentLine[col] || '';
                        const indent = currentLine.match(/^(\s*)/)?.[1] || '';
                        const textBeforeCursor = currentLine.slice(0, col);

                        // Check for triple backticks with optional language (```ts, ```rust, etc.)
                        const codeBlockMatch = textBeforeCursor.match(/^(\s*)```(\w*)$/);
                        if (codeBlockMatch) {
                            const blockIndent = codeBlockMatch[1];
                            // Insert newline, cursor line, newline, closing backticks
                            editor.insert('\n' + blockIndent + '\n' + blockIndent + '```');
                            editor.moveCursorUp();
                            editor.moveCursorLineEnd();
                        }
                        // Check if we're between matching brackets/braces/parens
                        else if ((charBefore === '{' && charAfter === '}') ||
                                 (charBefore === '[' && charAfter === ']') ||
                                 (charBefore === '(' && charAfter === ')')) {
                            // Between brackets - insert newline, indent, newline, closing bracket
                            editor.insert('\n' + indent + '    \n' + indent);
                            editor.moveCursorUp();
                            editor.moveCursorLineEnd();
                        } else {
                            // Regular enter - preserve current indentation
                            // If the line ends with an opener, add extra indent
                            const endsWithOpener = /[{(\[]$/.test(textBeforeCursor.trim());
                            if (endsWithOpener) {
                                editor.insert('\n' + indent + '    ');
                            } else {
                                editor.insert('\n' + indent);
                            }
                        }
                    } else if (e.key === 'Tab') {
                        editor.insert('    ');
                    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                        // Handle regular character input
                        // Auto-pairing for brackets and quotes (not backticks - used for code blocks)
                        const pairs = {
                            '(': ')',
                            '[': ']',
                            '{': '}',
                            '"': '"',
                            "'": "'"
                        };
                        const closers = [')', ']', '}', '"', "'"];

                        // Get character after cursor to check for skip-over
                        const content = editor.getContent();
                        const lines = content.split('\n');
                        const line = editor.getCursorLine();
                        const col = editor.getCursorColumn();
                        const currentLine = lines[line] || '';
                        const charAfter = currentLine[col] || '';

                        if (closers.includes(e.key) && charAfter === e.key) {
                            // Skip over the auto-inserted closing char
                            editor.moveCursorRight();
                        } else if (pairs[e.key]) {
                            // Insert both characters and move cursor back
                            editor.insert(e.key + pairs[e.key]);
                            editor.moveCursorLeft();
                        } else {
                            editor.insert(e.key);
                        }
                    } else if (e.metaKey || e.ctrlKey) {
                        // Handle shortcuts
                        if (e.key === 'z') {
                            if (e.shiftKey) {
                                editor.redo();
                            } else {
                                editor.undo();
                            }
                        } else if (e.key === 'y') {
                            editor.redo();
                        } else if (e.key === 'c') {
                            // Copy
                            const text = editor.getSelectedText();
                            if (text) {
                                navigator.clipboard.writeText(text).then(() => {
                                    log('Copied to clipboard');
                                }).catch(err => {
                                    log(`Copy failed: ${err}`, 'error');
                                });
                            }
                        } else if (e.key === 'x') {
                            // Cut
                            const text = editor.getSelectedText();
                            if (text) {
                                navigator.clipboard.writeText(text).then(() => {
                                    editor.backspace(); // Delete the selection
                                    updateHighlights();
                                    editor.forceRender();
                                    updateInfo();
                                    log('Cut to clipboard');
                                }).catch(err => {
                                    log(`Cut failed: ${err}`, 'error');
                                });
                            }
                        } else if (e.key === 'v') {
                            // Paste
                            navigator.clipboard.readText().then(text => {
                                if (text) {
                                    editor.insert(text);
                                    updateHighlights();
                                    editor.forceRender();
                                    updateInfo();
                                    log('Pasted from clipboard');
                                }
                            }).catch(err => {
                                log(`Paste failed: ${err}`, 'error');
                            });
                        } else {
                            handled = false;
                        }
                    } else {
                        handled = false;
                    }

                    if (handled) {
                        e.preventDefault();
                        editor.ensureCursorVisible();
                        updateHighlights(); // Update tree-sitter highlighting
                        editor.forceRender();
                        updateInfo();
                    }
                });

                // Handle mouse wheel scrolling
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    editor.scrollBy(e.deltaY);
                    editor.forceRender();
                }, { passive: false });

                // Animation loop for cursor blinking
                let lastRenderTime = 0;
                const BLINK_INTERVAL = 500; // 500ms half-cycle for cursor blink

                function animate(currentTime) {
                    // Only re-render periodically to update cursor blink
                    // The cursor blinks every 500ms, so we render at least that often
                    if (currentTime - lastRenderTime >= BLINK_INTERVAL) {
                        editor.forceRender();
                        lastRenderTime = currentTime;
                    }
                    requestAnimationFrame(animate);
                }

                // Start the animation loop
                requestAnimationFrame(animate);

                // Auto-focus the canvas
                canvas.focus();

                // Update info panel
                updateInfo();

                log('Iridium WebGPU test initialized successfully!', 'success');

            } catch (e) {
                wasmStatus.classList.remove('pending');
                wasmStatus.classList.add('error');
                editorStatus.classList.add('error');
                log(`Failed to initialize: ${e.message}`, 'error');
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>
