[package]
name = "iridium-desktop"
description = "The Iridium native desktop editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# The logic lives in the library so that everything a window is not needed for —
# key translation, argument parsing, the numeric conversions — is testable on
# the host. The binary is a shell over it, exactly as the terminal face's is.
[lib]
name = "iridium_desktop"
path = "src/lib.rs"

[[bin]]
name = "iridium-desktop"
path = "src/main.rs"

[dependencies]
# The kernel, with the GPU half on: this face renders through the kernel's
# FrameCompositor rather than growing a frame assembly of its own.
iridium-editor = { workspace = true, features = ["syntax", "render"] }

# The filesystem hierarchy the explorer panel shows, and the tree behaviour
# it is projected through. Both native-only, both shared with the terminal
# face when it grows the same panel.
iridium-explorer.workspace = true
iridium-tree.workspace = true

# The file layer shared with the terminal face: atomic saves, staleness by
# byte comparison, read-only refusal. One save path across every face.
iridium-file.workspace = true

# The user's `config.toml`. Native-only and shared with the terminal face, so
# one file means one thing in both — see that crate for why it is not folded
# into the kernel.
iridium-config.workspace = true

# The window and its event loop. The only crate here that knows what a native
# window is.
winit.workspace = true

# The GPU. Used only for the surface types NativeSurface hands the compositor
# and the overlay's second render pass.
wgpu.workspace = true

# Text areas and bounds for the overlay strip. Same version the kernel's
# render feature shapes text with; the renderers themselves are the kernel's.
glyphon.workspace = true

# The system clipboard. The desktop face is the first with real
# cross-application copy and paste.
arboard.workspace = true

# Grapheme clusters for the prompt field, so backspace over a joined emoji
# removes the whole cluster rather than leaving a dangling joiner.
unicode-segmentation.workspace = true

# Blocks the synchronous startup path on wgpu's async adapter/device requests.
# Same version the kernel's `render` feature already carries.
pollster = "0.4.0"

# Error types for what can go wrong before a window exists.
thiserror.workspace = true

# The macOS open panel, for `file.open` and `project.open` — see `dialog`.
#
# ⭐ **These add no crate to the build.** `cargo tree -p iridium-desktop -i
# objc2-app-kit` (9 Aug 2026) shows both major versions already compiled in:
# 0.2.2 under winit, 0.3.2 under arboard. So this is a new *edge* to a crate
# that is already there, and the 0.3 line is chosen to match arboard rather
# than winit for exactly that reason. `rfd` — the usual answer — would have
# brought its own stack to reach the identical `NSOpenPanel`.
#
# `default-features = false` because the default set is every AppKit header
# there is. `NSOpenPanel` is gated on `NSPanel`/`NSResponder`/`NSSavePanel`/
# `NSWindow`, and `runModal` and `NSModalResponseOK` — the two halves of
# reading the answer — are gated on `NSApplication` besides. `objc2-foundation`
# follows from `NSURL`, which is what a chosen file comes back as.
[target.'cfg(target_os = "macos")'.dependencies]
# `MainThreadMarker` — the runtime proof that AppKit is being called from the
# thread it insists on. Named directly rather than through
# `objc2_foundation`'s re-export, which is deprecated and would be a warning
# against a `-D warnings` gate.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
	"std",
	"NSApplication",
	"NSOpenPanel",
	"NSPanel",
	"NSResponder",
	"NSSavePanel",
	"NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
	"std",
	"NSArray",
	"NSString",
	"NSURL",
] }

[dev-dependencies]
# The file crate's test fixtures: the self-removing temporary directory the
# save tests write into.
iridium-file = { workspace = true, features = ["test-support"] }

# The config crate's theme fixtures: the two light faces D-1 ruled out of the
# binary and into `themes/`, which the overlay's derivation sweeps and the
# screenshot harness both need alongside the preset that did ship.
iridium-config = { workspace = true, features = ["test-support"] }

# PNG encoding and decoding for the chrome screenshot harness, which used to
# hand-roll an encoder to avoid exactly this dependency and paid 23.7 MB a
# frame for it — a measured 1.00008 compression ratio, 546 MB a run.
#
# Two things this buys that the hand-rolled encoder could not. Its deflate is
# a real dynamic-Huffman one: 63x on the harness's own frames against the 49x
# ceiling of the fixed-Huffman stream we would otherwise have had to write and
# own. And its *decoder* is the harness's oracle — the frames are now read
# back by code that did not write them, which is the check whose absence let
# the uncompressed stream survive unnoticed.
#
# Dev-only: never in the desktop binary, never in any face's runtime graph.
png = "0.18.1"
