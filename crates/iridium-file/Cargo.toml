[package]
name = "iridium-file"
description = "Reading and writing files for Iridium's faces, atomically"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "iridium_file"
path = "src/lib.rs"

[features]
# Exposes the `test_support` module — the self-removing temporary directory the
# faces' own test suites build their fixtures in. A feature rather than always
# public because nothing outside a test should ever want it.
test-support = []

# Disk I/O stays independent of the kernel. Paged storage uses unnamed temporary
# files for immutable snapshots and appended edits, with automatic cleanup.
[dependencies]
tempfile.workspace = true
