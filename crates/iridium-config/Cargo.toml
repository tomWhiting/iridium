[package]
name = "iridium-config"
description = "The user's configuration file for Iridium's native faces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Exposes the `test_support` module — the repository's shipped `themes/` files,
# loaded through this crate's own `--theme` path. A feature rather than always
# public because it reads the working tree, and nothing outside a test should
# ever want that. The same shape as `iridium-file`'s.
test-support = []

[lib]
name = "iridium_config"
path = "src/lib.rs"

[dependencies]
# The kernel, with the GPU half off: this crate reads text and produces
# `EditorConfig` values and `KeyBinding`s, and needs neither a renderer nor a
# syntax tree to do it. Which chords mean what, and which settings exist, are
# the kernel's answers — this crate only turns a file into them.
iridium-editor.workspace = true

# ⭐ **For the template, and for nothing else.** The file this crate writes on a
# first run has to list *every* binding, and 42 of them belong to the file
# explorer, whose default keys live in that panel rather than in the kernel.
# The panel's *commands* are registered in the kernel — #91 put them there — but
# which key runs each one is the panel's answer, and a template that could not
# ask it would ship a menu missing a third of its entries.
#
# ⚠️ **This adds no crate to any build.** Both consumers of this crate,
# `apps/iridium` and `apps/iridium-desktop`, already depend on `iridium-panel`
# (`grep iridium-panel apps/*/Cargo.toml`), so the edge is a graph edge and not
# a compilation. There is no cycle: `iridium-panel` deliberately takes its user
# layer as a `Keymap` argument rather than reading a configuration file, so it
# does not and will not depend on this crate.
#
# The alternative — having each face contribute the panel's layer to the
# template — was rejected: two callers would each have to remember, and a face
# that forgot would write a file that looked complete and was not. That is the
# defect class #116 was.
iridium-panel.workspace = true

# The file format. `toml` rather than JSON because a configuration file is
# written by hand and read by eye: comments survive, trailing commas are not a
# class of error, and a section heading is a section heading.
toml = "1.1.4"

# The derive `EditorConfig` already carries. This crate adds no schema of its
# own for the settings — that is the whole reason the kernel's type is used
# directly rather than mirrored here, where a mirror would agree with it
# exactly until the day a field was added to one and not the other.
serde.workspace = true

[dev-dependencies]
# Real files in a real directory, so the location tests read what they claim
# to read rather than a string standing in for it.
iridium-file = { workspace = true, features = ["test-support"] }
