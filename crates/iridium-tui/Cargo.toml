[package]
name = "iridium-tui"
description = "Terminal face for the Iridium editor kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["syntax"]
# Plain-text hosts can omit both the parser and the retained highlight snapshot.
syntax = ["iridium-editor/syntax", "dep:ropey"]

[dependencies]
# The kernel. No GPU: the terminal face uses the pure layout half of `render`.
iridium-editor = { path = "../iridium-editor", default-features = false }

# Retained immutable text snapshots for O(1) highlight-source freshness.
ropey = { workspace = true, optional = true }

# The file explorer, whole, and the row vocabulary it composes in. Shared with
# the GPU face so a rename means one thing in both — see `iridium_panel` for
# why that had to be a crate rather than a module in a face.
iridium-panel.workspace = true

# Terminal driver, input parsing, and the bridge between them.
# See docs/TERMINAL-STACK.md for the verified API surface of all three.
termina.workspace = true
terminput.workspace = true
terminput-termina.workspace = true

# Cell width. A cell is not a character; see docs/TERMINAL-FACE-PLAN.md.
unicode-width.workspace = true
unicode-segmentation.workspace = true

# The explorer panel's tests open real directories on a real reader thread,
# because the panel's whole job is showing what is on a disk and a fixture that
# faked one would be testing something else.
[dev-dependencies]
iridium-file = { workspace = true, features = ["test-support"] }

# Cell Frame preparation/paint and retained snapshot edit costs, without a TTY.
[[bench]]
name = "cell_composer"
harness = false
# This benchmark includes Rust parser/cache costs as well as a plain control.
required-features = ["syntax"]
