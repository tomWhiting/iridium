[package]
name = "iridium-syntax"
description = "Syntax highlighting and code intelligence via tree-sitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Which language a document is in. Its own crate because the parser-free build
# of `iridium-editor` needs the same answer without any of the below — see
# that crate for the divergence that made two copies untenable.
iridium-lang.workspace = true

# Syntax parsing
tree-sitter.workspace = true

# Language grammars
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-json.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-md.workspace = true
tree-sitter-css.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-javascript.workspace = true

# Serialization (highlight queries)
serde.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
