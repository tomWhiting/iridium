<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iridium Editor - WebGPU Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #252526;
            padding: 12px 20px;
            border-bottom: 1px solid #3c3c3c;
        }
        h1 {
            font-size: 18px;
            font-weight: 500;
        }
        .status {
            display: flex;
            gap: 20px;
            margin-top: 8px;
            font-size: 13px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3c3c3c;
        }
        .status-dot.success { background: #4ec9b0; }
        .status-dot.error { background: #f14c4c; }
        .status-dot.pending { background: #cca700; }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .editor-container {
            flex: 1;
            position: relative;
            min-height: 400px;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            overflow: hidden;
        }
        #editor-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            cursor: text;
        }
        #editor-canvas:focus {
            box-shadow: inset 0 0 0 2px #0e639c;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #3c3c3c;
            cursor: not-allowed;
        }
        .info-panel {
            margin-top: 12px;
            padding: 12px;
            background: #252526;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .error-message {
            color: #f14c4c;
            padding: 20px;
            text-align: center;
        }
        #log {
            margin-top: 12px;
            padding: 12px;
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
        }
        .log-entry {
            padding: 2px 0;
        }
        .log-entry.error { color: #f14c4c; }
        .log-entry.success { color: #4ec9b0; }
        .log-entry.info { color: #569cd6; }
    </style>
</head>
<body>
    <header>
        <h1>Iridium Editor - WebGPU Test</h1>
        <div class="status">
            <div class="status-item">
                <div class="status-dot" id="webgpu-status"></div>
                <span>WebGPU</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="wasm-status"></div>
                <span>WASM Module</span>
            </div>
            <div class="status-item">
                <div class="status-dot" id="editor-status"></div>
                <span>Editor</span>
            </div>
        </div>
    </header>
    <main>
        <div class="toolbar">
            <button id="btn-insert" disabled>Insert Text</button>
            <button id="btn-clear" disabled>Clear</button>
            <button id="btn-undo" disabled>Undo</button>
            <button id="btn-redo" disabled>Redo</button>
            <button id="btn-theme" disabled>Toggle Theme</button>
            <button id="btn-syntax" disabled>Toggle Syntax</button>
            <button id="btn-gutter" disabled>Toggle Gutter</button>
            <button id="btn-fold-all" disabled>Fold All</button>
            <button id="btn-unfold-all" disabled>Unfold All</button>
            <button id="btn-toggle-fold" disabled>Toggle Fold</button>
        </div>
        <div class="editor-container">
            <canvas id="editor-canvas" tabindex="0"></canvas>
        </div>
        <div class="info-panel" id="info">
            Cursor: Line 0, Column 0 | Lines: 0 | Undo: false | Redo: false
        </div>
        <div id="log"></div>
    </main>

    <script type="module">
        // Logging utility
        const logEl = document.getElementById('log');
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        // Status indicators
        const webgpuStatus = document.getElementById('webgpu-status');
        const wasmStatus = document.getElementById('wasm-status');
        const editorStatus = document.getElementById('editor-status');

        // Buttons
        const btnInsert = document.getElementById('btn-insert');
        const btnClear = document.getElementById('btn-clear');
        const btnUndo = document.getElementById('btn-undo');
        const btnRedo = document.getElementById('btn-redo');
        const btnTheme = document.getElementById('btn-theme');
        const btnSyntax = document.getElementById('btn-syntax');
        const btnGutter = document.getElementById('btn-gutter');
        const btnFoldAll = document.getElementById('btn-fold-all');
        const btnUnfoldAll = document.getElementById('btn-unfold-all');
        const btnToggleFold = document.getElementById('btn-toggle-fold');

        // Info panel
        const infoPanel = document.getElementById('info');

        // Editor state
        let editor = null;
        let isDarkTheme = true;

        function updateInfo() {
            if (!editor) return;
            const line = editor.getCursorLine();
            const col = editor.getCursorColumn();
            const lines = editor.getLineCount();
            const canUndo = editor.canUndo();
            const canRedo = editor.canRedo();
            const foldableLines = editor.getFoldableLines();
            const foldedLines = editor.getFoldedLines();
            const hiddenCount = editor.getHiddenLineCount();
            const isFoldable = editor.isFoldable(line);
            infoPanel.textContent = `Cursor: Line ${line}, Col ${col} | Lines: ${lines} (${hiddenCount} hidden) | Foldable: ${foldableLines.length} | Folded: ${foldedLines.length} | Line foldable: ${isFoldable}`;
        }

        async function init() {
            log('Starting Iridium WebGPU test...');

            // Check WebGPU support
            log('Checking WebGPU support...');
            if (!navigator.gpu) {
                webgpuStatus.classList.add('error');
                log('WebGPU is not supported in this browser', 'error');
                return;
            }

            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    webgpuStatus.classList.add('error');
                    log('No WebGPU adapter found', 'error');
                    return;
                }
                webgpuStatus.classList.add('success');
                log(`WebGPU adapter: ${adapter.name || 'unnamed'}`, 'success');
            } catch (e) {
                webgpuStatus.classList.add('error');
                log(`WebGPU error: ${e.message}`, 'error');
                return;
            }

            // Load WASM module
            log('Loading WASM module...');
            wasmStatus.classList.add('pending');

            try {
                // Import the WASM module (built by wasm-pack)
                const wasm = await import('./pkg/iridium_bindings.js');
                await wasm.default();

                wasmStatus.classList.remove('pending');
                wasmStatus.classList.add('success');
                log('WASM module loaded', 'success');

                // Check if WebGPU is supported via WASM
                const supported = await wasm.isWebGPUSupported();
                log(`WASM WebGPU check: ${supported}`, supported ? 'success' : 'error');

                // Create editor
                log('Creating WebEditor...');
                editorStatus.classList.add('pending');

                const canvas = document.getElementById('editor-canvas');
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;

                const pixelRatio = window.devicePixelRatio || 1;
                editor = await wasm.createWebEditor(canvas, pixelRatio);

                editorStatus.classList.remove('pending');
                editorStatus.classList.add('success');
                log('WebEditor created', 'success');

                // Load a font - REQUIRED for WASM since no system fonts are available
                log('Fetching font...');
                const fontUrl = 'https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/ttf/FiraCode-Regular.ttf';
                const fontResponse = await fetch(fontUrl);
                if (!fontResponse.ok) {
                    throw new Error(`Failed to fetch font: ${fontResponse.status}`);
                }
                const fontData = new Uint8Array(await fontResponse.arrayBuffer());
                editor.loadFont(fontData);
                log('Font loaded', 'success');

                // Set initial content - has multiple foldable regions
                editor.setContent(`// Welcome to Iridium Editor!
// This is a GPU-accelerated text editor built with Rust and WebGPU.

fn main() {
    println!("Hello, Iridium!");

    if true {
        println!("Nested block!");
    }
}

fn another_function() {
    // This is another function
    let x = 42;
    let result = {
        // Inner block
        x * 2
    };
    println!("Result: {}", result);
}

struct Example {
    field1: i32,
    field2: String,
}
`);
                log('Initial content set');

                // Initial render
                editor.forceRender();
                log('Initial render complete', 'success');

                // Enable buttons
                btnInsert.disabled = false;
                btnClear.disabled = false;
                btnUndo.disabled = false;
                btnRedo.disabled = false;
                btnTheme.disabled = false;
                btnSyntax.disabled = false;
                btnGutter.disabled = false;
                btnFoldAll.disabled = false;
                btnUnfoldAll.disabled = false;
                btnToggleFold.disabled = false;

                // Set up button handlers
                btnInsert.addEventListener('click', () => {
                    editor.insert('\n// Inserted line');
                    editor.forceRender();
                    updateInfo();
                });

                btnClear.addEventListener('click', () => {
                    editor.setContent('');
                    editor.forceRender();
                    updateInfo();
                });

                btnUndo.addEventListener('click', () => {
                    editor.undo();
                    editor.forceRender();
                    updateInfo();
                });

                btnRedo.addEventListener('click', () => {
                    editor.redo();
                    editor.forceRender();
                    updateInfo();
                });

                btnTheme.addEventListener('click', () => {
                    isDarkTheme = !isDarkTheme;
                    editor.setDarkTheme(isDarkTheme);
                    editor.forceRender();
                });

                btnSyntax.addEventListener('click', () => {
                    const enabled = editor.isSyntaxEnabled();
                    editor.setSyntaxEnabled(!enabled);
                    editor.forceRender();
                    log(`Syntax highlighting ${!enabled ? 'enabled' : 'disabled'}`);
                });

                btnGutter.addEventListener('click', () => {
                    const enabled = editor.isGutterEnabled();
                    editor.setGutterEnabled(!enabled);
                    editor.forceRender();
                    log(`Gutter ${!enabled ? 'enabled' : 'disabled'}`);
                });

                btnFoldAll.addEventListener('click', () => {
                    editor.foldAll();
                    editor.forceRender();
                    updateInfo();
                    log('Folded all regions');
                });

                btnUnfoldAll.addEventListener('click', () => {
                    editor.unfoldAll();
                    editor.forceRender();
                    updateInfo();
                    log('Unfolded all regions');
                });

                btnToggleFold.addEventListener('click', () => {
                    const line = editor.getCursorLine();
                    const toggled = editor.toggleFold(line);
                    editor.forceRender();
                    updateInfo();
                    if (toggled) {
                        const isFolded = editor.isFolded(line);
                        log(`Line ${line} ${isFolded ? 'folded' : 'unfolded'}`);
                    } else {
                        log(`Line ${line} is not foldable`);
                    }
                });

                // Handle window resize
                window.addEventListener('resize', () => {
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = rect.width * window.devicePixelRatio;
                    canvas.height = rect.height * window.devicePixelRatio;
                    editor.resize(canvas.width, canvas.height);
                    editor.forceRender();
                });

                // Mouse selection handling
                let isDragging = false;

                function getMousePosition(e) {
                    const rect = canvas.getBoundingClientRect();
                    // Account for pixel ratio - mouse events are in CSS pixels, canvas is scaled
                    const x = (e.clientX - rect.left) * window.devicePixelRatio;
                    const y = (e.clientY - rect.top) * window.devicePixelRatio;
                    return editor.pixelToPosition(x, y);
                }

                canvas.addEventListener('mousedown', (e) => {
                    canvas.focus();
                    const [line, column] = getMousePosition(e);

                    if (e.shiftKey) {
                        // Shift+click: extend selection
                        editor.extendSelectionToPosition(line, column);
                    } else {
                        // Normal click: set cursor, start potential drag
                        editor.setCursorFromClick(line, column);
                        isDragging = true;
                    }
                    editor.forceRender();
                    updateInfo();
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const [line, column] = getMousePosition(e);
                        editor.extendSelectionToPosition(line, column);
                        editor.forceRender();
                        updateInfo();
                    }
                });

                canvas.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                canvas.addEventListener('mouseleave', () => {
                    // Continue drag if mouse leaves canvas
                    // (don't stop dragging, let mouseup on document handle it)
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                // Handle keyboard input with Mac modifier support
                canvas.addEventListener('keydown', (e) => {
                    let handled = true;
                    const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
                    const selecting = e.shiftKey;

                    // Handle arrow keys with modifiers
                    if (e.key === 'ArrowLeft') {
                        if (e.metaKey && isMac) {
                            // Cmd+Left: go to line start
                            selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                        } else if (e.altKey) {
                            // Option+Left: word left
                            selecting ? editor.extendSelectionWordLeft() : editor.moveCursorWordLeft();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Left on non-Mac: word left
                            selecting ? editor.extendSelectionWordLeft() : editor.moveCursorWordLeft();
                        } else {
                            selecting ? editor.extendSelectionLeft() : editor.moveCursorLeft();
                        }
                    } else if (e.key === 'ArrowRight') {
                        if (e.metaKey && isMac) {
                            // Cmd+Right: go to line end
                            selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                        } else if (e.altKey) {
                            // Option+Right: word right
                            selecting ? editor.extendSelectionWordRight() : editor.moveCursorWordRight();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Right on non-Mac: word right
                            selecting ? editor.extendSelectionWordRight() : editor.moveCursorWordRight();
                        } else {
                            selecting ? editor.extendSelectionRight() : editor.moveCursorRight();
                        }
                    } else if (e.key === 'ArrowUp') {
                        if (e.metaKey && isMac) {
                            // Cmd+Up: go to document start
                            selecting ? editor.extendSelectionDocStart() : editor.moveCursorDocStart();
                        } else {
                            selecting ? editor.extendSelectionUp() : editor.moveCursorUp();
                        }
                    } else if (e.key === 'ArrowDown') {
                        if (e.metaKey && isMac) {
                            // Cmd+Down: go to document end
                            selecting ? editor.extendSelectionDocEnd() : editor.moveCursorDocEnd();
                        } else {
                            selecting ? editor.extendSelectionDown() : editor.moveCursorDown();
                        }
                    } else if (e.key === 'Home') {
                        // Home key: line start (or doc start with Cmd)
                        if (e.metaKey || e.ctrlKey) {
                            selecting ? editor.extendSelectionDocStart() : editor.moveCursorDocStart();
                        } else {
                            selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                        }
                    } else if (e.key === 'End') {
                        // End key: line end (or doc end with Cmd)
                        if (e.metaKey || e.ctrlKey) {
                            selecting ? editor.extendSelectionDocEnd() : editor.moveCursorDocEnd();
                        } else {
                            selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                        }
                    } else if (e.key === 'a' && (e.metaKey || e.ctrlKey)) {
                        // Cmd+A / Ctrl+A: select all
                        editor.selectAll();
                    } else if (e.key === 'Backspace') {
                        if (e.metaKey && isMac) {
                            // Cmd+Backspace: delete to line start
                            editor.deleteToLineStart();
                        } else if (e.altKey) {
                            // Option+Backspace: delete word backward
                            editor.deleteWordBackward();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Backspace on non-Mac: delete word backward
                            editor.deleteWordBackward();
                        } else {
                            // Check if we're deleting an opening bracket with matching closer
                            const pairMap = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
                            const content = editor.getContent();
                            const lines = content.split('\n');
                            const line = editor.getCursorLine();
                            const col = editor.getCursorColumn();
                            const currentLine = lines[line] || '';
                            const charBefore = col > 0 ? currentLine[col - 1] : '';
                            const charAfter = currentLine[col] || '';

                            if (pairMap[charBefore] && charAfter === pairMap[charBefore]) {
                                // Delete both the opener and closer
                                editor.backspace();
                                editor.delete_forward();
                            } else {
                                editor.backspace();
                            }
                        }
                    } else if (e.key === 'Delete') {
                        if (e.altKey) {
                            // Option+Delete (Fn+Option+Backspace): delete word forward
                            editor.deleteWordForward();
                        } else if (e.ctrlKey && !isMac) {
                            // Ctrl+Delete on non-Mac: delete word forward
                            editor.deleteWordForward();
                        } else {
                            editor.delete_forward();
                        }
                    } else if (e.key === 'k' && e.ctrlKey) {
                        // Ctrl+K: delete to end of line (Emacs-style)
                        editor.deleteToLineEnd();
                    } else if (e.key === 'a' && e.ctrlKey && isMac && !e.metaKey) {
                        // Ctrl+A on Mac: go to line start (Emacs-style)
                        selecting ? editor.extendSelectionLineStart() : editor.moveCursorLineStart();
                    } else if (e.key === 'e' && e.ctrlKey && isMac) {
                        // Ctrl+E on Mac: go to line end (Emacs-style)
                        selecting ? editor.extendSelectionLineEnd() : editor.moveCursorLineEnd();
                    } else if (e.key === 'Enter') {
                        const content = editor.getContent();
                        const lines = content.split('\n');
                        const line = editor.getCursorLine();
                        const col = editor.getCursorColumn();
                        const currentLine = lines[line] || '';
                        const charBefore = col > 0 ? currentLine[col - 1] : '';
                        const charAfter = currentLine[col] || '';
                        const indent = currentLine.match(/^(\s*)/)?.[1] || '';
                        const textBeforeCursor = currentLine.slice(0, col);

                        // Check for triple backticks with optional language (```ts, ```rust, etc.)
                        const codeBlockMatch = textBeforeCursor.match(/^(\s*)```(\w*)$/);
                        if (codeBlockMatch) {
                            const blockIndent = codeBlockMatch[1];
                            // Insert newline, cursor line, newline, closing backticks
                            editor.insert('\n' + blockIndent + '\n' + blockIndent + '```');
                            editor.moveCursorUp();
                            editor.moveCursorLineEnd();
                        }
                        // Check if we're between matching brackets/braces/parens
                        else if ((charBefore === '{' && charAfter === '}') ||
                                 (charBefore === '[' && charAfter === ']') ||
                                 (charBefore === '(' && charAfter === ')')) {
                            // Between brackets - insert newline, indent, newline, closing bracket
                            editor.insert('\n' + indent + '    \n' + indent);
                            editor.moveCursorUp();
                            editor.moveCursorLineEnd();
                        } else {
                            // Regular enter - preserve current indentation
                            // If the line ends with an opener, add extra indent
                            const endsWithOpener = /[{(\[]$/.test(textBeforeCursor.trim());
                            if (endsWithOpener) {
                                editor.insert('\n' + indent + '    ');
                            } else {
                                editor.insert('\n' + indent);
                            }
                        }
                    } else if (e.key === 'Tab') {
                        editor.insert('    ');
                    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                        // Handle regular character input
                        // Auto-pairing for brackets and quotes (not backticks - used for code blocks)
                        const pairs = {
                            '(': ')',
                            '[': ']',
                            '{': '}',
                            '"': '"',
                            "'": "'"
                        };
                        const closers = [')', ']', '}', '"', "'"];

                        // Get character after cursor to check for skip-over
                        const content = editor.getContent();
                        const lines = content.split('\n');
                        const line = editor.getCursorLine();
                        const col = editor.getCursorColumn();
                        const currentLine = lines[line] || '';
                        const charAfter = currentLine[col] || '';

                        if (closers.includes(e.key) && charAfter === e.key) {
                            // Skip over the auto-inserted closing char
                            editor.moveCursorRight();
                        } else if (pairs[e.key]) {
                            // Insert both characters and move cursor back
                            editor.insert(e.key + pairs[e.key]);
                            editor.moveCursorLeft();
                        } else {
                            editor.insert(e.key);
                        }
                    } else if (e.metaKey || e.ctrlKey) {
                        // Handle shortcuts
                        if (e.key === 'z') {
                            if (e.shiftKey) {
                                editor.redo();
                            } else {
                                editor.undo();
                            }
                        } else if (e.key === 'y') {
                            editor.redo();
                        } else if (e.key === 'c') {
                            // Copy
                            const text = editor.getSelectedText();
                            if (text) {
                                navigator.clipboard.writeText(text).then(() => {
                                    log('Copied to clipboard');
                                }).catch(err => {
                                    log(`Copy failed: ${err}`, 'error');
                                });
                            }
                        } else if (e.key === 'x') {
                            // Cut
                            const text = editor.getSelectedText();
                            if (text) {
                                navigator.clipboard.writeText(text).then(() => {
                                    editor.backspace(); // Delete the selection
                                    editor.forceRender();
                                    updateInfo();
                                    log('Cut to clipboard');
                                }).catch(err => {
                                    log(`Cut failed: ${err}`, 'error');
                                });
                            }
                        } else if (e.key === 'v') {
                            // Paste
                            navigator.clipboard.readText().then(text => {
                                if (text) {
                                    editor.insert(text);
                                    editor.forceRender();
                                    updateInfo();
                                    log('Pasted from clipboard');
                                }
                            }).catch(err => {
                                log(`Paste failed: ${err}`, 'error');
                            });
                        } else {
                            handled = false;
                        }
                    } else {
                        handled = false;
                    }

                    if (handled) {
                        e.preventDefault();
                        editor.ensureCursorVisible();
                        editor.forceRender();
                        updateInfo();
                    }
                });

                // Handle mouse wheel scrolling
                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    editor.scrollBy(e.deltaY);
                    editor.forceRender();
                }, { passive: false });

                // Animation loop for cursor blinking
                let lastRenderTime = 0;
                const BLINK_INTERVAL = 500; // 500ms half-cycle for cursor blink

                function animate(currentTime) {
                    // Only re-render periodically to update cursor blink
                    // The cursor blinks every 500ms, so we render at least that often
                    if (currentTime - lastRenderTime >= BLINK_INTERVAL) {
                        editor.forceRender();
                        lastRenderTime = currentTime;
                    }
                    requestAnimationFrame(animate);
                }

                // Start the animation loop
                requestAnimationFrame(animate);

                // Auto-focus the canvas
                canvas.focus();

                // Update info panel
                updateInfo();

                log('Iridium WebGPU test initialized successfully!', 'success');

            } catch (e) {
                wasmStatus.classList.remove('pending');
                wasmStatus.classList.add('error');
                editorStatus.classList.add('error');
                log(`Failed to initialize: ${e.message}`, 'error');
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>
