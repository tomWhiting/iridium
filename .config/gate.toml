suite = "v1"

# The compiles and tested levels hold one entry per check scripts/ci.sh runs.
# The suite's clippy always adds --workspace and --all-targets, and its nextest
# takes no options, so the per-package, per-feature and wasm configurations
# carry a run override until a kind can say them. clippy-wasm also covers the
# old check/wasm step. nextest runs no doctests, which ci.sh's cargo test did:
# docs runs them.
#
# New with the gate, never in ci.sh: portable, and the web level, which
# type-checks the TypeScript packages and both examples and runs the
# packages' bun tests. The examples have no tests of their own; the web
# component's only TypeScript is its vite config, its page script inline.

[portable]
  kind = "ast-grep"
  rules = "portable"
  port_config = "ports.json"

[clippy-workspace]
  kind = "clippy"
  options = ["--all-features"]
  on = ["mac", "linux"]

[clippy-kernel]
  kind = "clippy"
  run = ["cargo", "clippy", "--message-format=json", "-p", "iridium-editor", "--no-default-features", "--all-targets", "--", "-D", "warnings"]

[clippy-syntax]
  kind = "clippy"
  run = ["cargo", "clippy", "--message-format=json", "-p", "iridium-editor", "--no-default-features", "--features", "syntax", "--all-targets", "--", "-D", "warnings"]

[clippy-wasm]
  kind = "clippy"
  run = ["cargo", "clippy", "--message-format=json", "-p", "iridium-bindings", "--no-default-features", "--features", "web", "--target", "wasm32-unknown-unknown", "--", "-D", "warnings"]

[nextest-workspace]
  kind = "nextest"
  run = ["cargo", "nextest", "run", "--no-fail-fast", "--message-format", "libtest-json", "--message-format-version", "0.1", "--workspace", "--all-features"]
  on = ["mac", "linux"]

[nextest-kernel]
  kind = "nextest"
  run = ["cargo", "nextest", "run", "--no-fail-fast", "--message-format", "libtest-json", "--message-format-version", "0.1", "-p", "iridium-editor", "--no-default-features"]

[nextest-syntax]
  kind = "nextest"
  run = ["cargo", "nextest", "run", "--no-fail-fast", "--message-format", "libtest-json", "--message-format-version", "0.1", "-p", "iridium-editor", "--no-default-features", "--features", "syntax"]

[nextest-lang]
  kind = "nextest"
  run = ["cargo", "nextest", "run", "--no-fail-fast", "--message-format", "libtest-json", "--message-format-version", "0.1", "-p", "iridium-lang", "--all-features"]

[docs]
  on = ["mac", "linux"]

[tsc-examples-web]
  dir = "examples/web"
  kind = "tsc"

[tsc-examples-web-component]
  dir = "examples/web-component"
  kind = "tsc"

[tsc-packages-iridium-core]
  dir = "packages/@iridium/core"
  kind = "tsc"

[tsc-packages-iridium-syntax-worker]
  dir = "packages/@iridium/syntax-worker"
  kind = "tsc"



[bun-packages-iridium-core]
  dir = "packages/@iridium/core"
  kind = "bun"

[bun-packages-iridium-syntax-worker]
  dir = "packages/@iridium/syntax-worker"
  kind = "bun"
