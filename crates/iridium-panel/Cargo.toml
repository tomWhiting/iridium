[package]
name = "iridium-panel"
description = "The row vocabulary Iridium's panels are composed in, in every face"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "iridium_panel"
path = "src/lib.rs"

# The kernel's theme, and nothing else from it. A span carries a colour, and a
# colour is the theme's to name — but no renderer, no device and no window
# reaches this crate, which is what lets the terminal face depend on it.
[dependencies]
iridium-editor = { workspace = true, default-features = false }

# ⚠️ **This narrows the crate to native targets, deliberately.** The explorer
# filters a real filesystem hierarchy, and `iridium-explorer` is native by
# nature — a browser has no directory to read. Both faces that depend on this
# crate are native; the web face composes its panels in TypeScript and never
# links it. Nothing here is reachable from `iridium-bindings`, so the wasm gate
# is unaffected, and the day that changes it will change loudly rather than
# silently.
iridium-explorer.workspace = true

# The selection, expansion and row projection the explorer's hierarchy is
# shown through. Face-independent by construction — it has no idea anything is
# drawn — and shared with the terminal face for the same reason this crate is.
iridium-tree.workspace = true

# Grapheme clusters, for the one place a row is truncated. A row cut between a
# base character and its combining mark is a row that renders as a different
# character, which is why this is counted in clusters rather than in `char`s.
unicode-segmentation.workspace = true

# The rename pipeline's tests build real directories and rename real files:
# the whole point of `apply` is that it touches a disk, and a fixture that
# faked one would be testing something else.
[dev-dependencies]
iridium-file = { workspace = true, features = ["test-support"] }
