[package]
name = "iridium-editor"
description = "Text editor core with optional GPU rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# GPU rendering (optional: enabled by the `render` feature)
wgpu = { workspace = true, optional = true }
glyphon = { workspace = true, optional = true }

# Text buffer
ropey.workspace = true

# The generic tree model the workspace projects through. A compile-time
# edge with no runtime cost, and zero dependencies of its own.
iridium-tree.workspace = true

# Syntax (internal, optional for WASM builds without tree-sitter)
iridium-syntax = { workspace = true, optional = true }

# Which language a document is in — **not** optional, and that is the point.
# Comment toggling, indent rules and auto-pairs all key off the language and
# none of them parses anything, so the answer must be the same with or without
# the `syntax` feature. It used to be a stub in this crate that quietly
# disagreed; see `iridium_lang` for what that cost.
iridium-lang.workspace = true

# Serialization (themes, config)
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Search
regex.workspace = true

# Logging
tracing.workspace = true

# GPU support crates (optional: enabled by the `render` feature)
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }

# Cross-platform time (works on WASM)
web-time.workspace = true

# WASM/Browser (optional)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
rust-lapper = "1.2.0"

[features]
default = ["syntax", "render"]
syntax = ["iridium-syntax"]
# GPU rendering back end. Without it the editing kernel (document, history, input,
# search, theme, view and the pure layout half of `render`) compiles with no GPU
# crate anywhere in its dependency graph.
render = ["dep:wgpu", "dep:glyphon", "dep:pollster", "dep:bytemuck"]
# Browser surface. Implies `render`, because every item the feature exposes
# (`render::web`, `WebSurface`) is gated on `all(feature = "render", feature =
# "web")` — selecting `web` alone would enable four dependencies and no API.
web = [
    "render",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
]

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true

# The attribution harness measures where a keystroke's time goes when a language
# is set. Without `syntax` there is no parser, `sync` returns early and folds
# come off a brace scan — the configuration the cost never existed in, and one
# where the harness has no node counter to read.
[[example]]
name = "attribute_keystroke"
required-features = ["syntax"]

[[bench]]
name = "editing"
harness = false

# The compose-path frame time on a 10k-line document, driven headlessly onto
# an offscreen texture — no surface, no window. Without `render` there is no
# compositor to time, so the feature is required rather than optional.
[[bench]]
name = "compose_frame"
harness = false
required-features = ["render"]

# The retained-shaping proof harness: the staleness matrix over every shape-key
# input and the hot-vs-cold pixel-identity oracle for the compositor's shape
# cache. Headless GPU by construction, exactly like the compose bench. Without
# `render` there is no compositor to prove; the fold rows need a parser for
# regions, so `syntax` is required too.
[[test]]
name = "retained_shaping"
required-features = ["render", "syntax"]

# The reserved-band proof: painting, hit-testing, scroll-to-caret and the
# scroll clamp must all measure from the same top inset. Needs a real
# compositor, so it needs `render`.
[[test]]
name = "top_inset"
required-features = ["render"]

# The same proof on the other axis: a face reserving chrome beside the
# document moves the gutter, its numbers, the change bars and the content
# column together, and nothing it draws reaches into the reserved band.
[[test]]
name = "left_inset"
required-features = ["render"]

# The evidence that a weight and a slant become different glyphs rather than
# different attributes on the same ones — a real compose, read back, compared
# against a plain-versus-plain control.
[[test]]
name = "run_weight_reaches_the_glyphs"
required-features = ["render"]

[[bench]]
name = "rendering"
harness = false

# Without `syntax` there is no parser, and `SyntaxState` degrades to the stub
# surface — the benchmark would still build and would then measure two functions
# that do nothing. Required rather than optional so it cannot report a passing
# number for work that never happened.
[[bench]]
name = "syntax"
harness = false
required-features = ["syntax"]

# The parser tax, measured: the whole-document span derive that made a
# keystroke O(document) (docs/design/PARSER-TAX-MAP.md), beside the
# range-scoped derive the faces' caches now run, and the index build on each
# span set. Requires `syntax` for the same reason as the syntax bench: without
# a parser, both derives would measure nothing and report it as speed.
[[bench]]
name = "span_derive"
harness = false
required-features = ["syntax"]

# The per-keystroke cost with a language set. Required rather than optional for
# the same reason: without `syntax` there is no parser, `sync` returns early, and
# the benchmark would report a healthy number for the exact configuration the bug
# could not occur in — which is how the bug survived in the first place.
[[bench]]
name = "folding"
harness = false
required-features = ["syntax"]
