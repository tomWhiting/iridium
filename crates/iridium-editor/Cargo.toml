[package]
name = "iridium-editor"
description = "GPU-accelerated text editor core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# GPU rendering
wgpu.workspace = true
glyphon.workspace = true
cosmic-text.workspace = true

# Text buffer
ropey.workspace = true

# Syntax (internal, optional for WASM builds without tree-sitter)
iridium-syntax = { workspace = true, optional = true }

# Serialization (themes, config)
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Search
regex.workspace = true

# Logging
tracing.workspace = true
pollster = "0.4.0"
bytemuck = { version = "1.24.0", features = ["derive"] }

# Cross-platform time (works on WASM)
web-time.workspace = true

# WASM/Browser (optional)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
rust-lapper = "1.2.0"

[features]
default = ["syntax"]
syntax = ["iridium-syntax"]
web = ["wasm-bindgen", "wasm-bindgen-futures", "web-sys", "js-sys"]

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "rendering"
harness = false
