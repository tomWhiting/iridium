name = "TOML"
grammar = "toml"
path_suffixes = ["toml", "Cargo.lock", "Pipfile"]
line_comments = ["# "]
tab_size = 2
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = '"', end = '"', close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
