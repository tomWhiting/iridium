[package]
name = "iridium-editor"
description = "Text editor core with optional GPU rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# GPU rendering (optional: enabled by the `render` feature)
wgpu = { workspace = true, optional = true }
glyphon = { workspace = true, optional = true }
cosmic-text = { workspace = true, optional = true }

# Text buffer
ropey.workspace = true

# Syntax (internal, optional for WASM builds without tree-sitter)
iridium-syntax = { workspace = true, optional = true }

# Serialization (themes, config)
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Search
regex.workspace = true

# Logging
tracing.workspace = true

# GPU support crates (optional: enabled by the `render` feature)
pollster = { version = "0.4.0", optional = true }
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }

# Cross-platform time (works on WASM)
web-time.workspace = true

# WASM/Browser (optional)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
rust-lapper = "1.2.0"

[features]
default = ["syntax", "render"]
syntax = ["iridium-syntax"]
# GPU rendering back end. Without it the editing kernel (document, history, input,
# search, theme, view and the pure layout half of `render`) compiles with no GPU
# crate anywhere in its dependency graph.
render = ["dep:wgpu", "dep:glyphon", "dep:cosmic-text", "dep:pollster", "dep:bytemuck"]
# Browser surface. Implies `render`, because every item the feature exposes
# (`render::web`, `WebSurface`) is gated on `all(feature = "render", feature =
# "web")` — selecting `web` alone would enable four dependencies and no API.
web = [
    "render",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "js-sys",
]

[dev-dependencies]
criterion.workspace = true
tracing-subscriber.workspace = true

# The attribution harness measures where a keystroke's time goes when a language
# is set. Without `syntax` there is no parser, `sync` returns early and folds
# come off a brace scan — the configuration the cost never existed in, and one
# where the harness has no node counter to read.
[[example]]
name = "attribute_keystroke"
required-features = ["syntax"]

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "rendering"
harness = false

# Without `syntax` there is no parser, and `SyntaxState` degrades to the stub
# surface — the benchmark would still build and would then measure two functions
# that do nothing. Required rather than optional so it cannot report a passing
# number for work that never happened.
[[bench]]
name = "syntax"
harness = false
required-features = ["syntax"]

# The per-keystroke cost with a language set. Required rather than optional for
# the same reason: without `syntax` there is no parser, `sync` returns early, and
# the benchmark would report a healthy number for the exact configuration the bug
# could not occur in — which is how the bug survived in the first place.
[[bench]]
name = "folding"
harness = false
required-features = ["syntax"]
