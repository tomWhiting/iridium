[package]
name = "iridium-syntax"
description = "Syntax highlighting and code intelligence via tree-sitter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# Which language a document is in, and the vendored `.scm` text this crate
# compiles. Its own crate because the parser-free build of `iridium-editor`
# needs the same answers without any of the below — see that crate for the
# divergence that made two copies untenable, and for why the vendored tree
# stays whole rather than being split across the feature boundary.
iridium-lang.workspace = true

# Syntax parsing
tree-sitter.workspace = true

# Turns the C symbol of a vendored grammar into a `tree_sitter::Language`.
# Needed for AWL, which has no published crate — see `build.rs`.
tree-sitter-language.workspace = true

# Language grammars
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-go.workspace = true
tree-sitter-json.workspace = true
tree-sitter-yaml.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-md.workspace = true
tree-sitter-css.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-cypher.workspace = true
tree-sitter-diff.workspace = true
tree-sitter-gitcommit.workspace = true
tree-sitter-glsl.workspace = true
tree-sitter-gomod.workspace = true
tree-sitter-gowork.workspace = true
tree-sitter-html.workspace = true
tree-sitter-java.workspace = true
tree-sitter-jsdoc.workspace = true
tree-sitter-nu.workspace = true
tree-sitter-proto.workspace = true
tree-sitter-regex.workspace = true
tree-sitter-sequel.workspace = true
tree-sitter-tsquery.workspace = true
tree-sitter-zig.workspace = true
tree-sitter-xml.workspace = true

# Serialization (highlight queries)
serde.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

# Compiles the vendored C grammars under `grammars/`. Host-only, so it does
# not reach the wasm target.
[build-dependencies]
cc.workspace = true

[dev-dependencies]
criterion.workspace = true
